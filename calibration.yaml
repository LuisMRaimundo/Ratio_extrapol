# STE Lab calibration policy. Exported with every woodwind result book.
# Default production mode: do not replace a target-instrument measurement.

transfer:
  enabled: true
  # two_log_ratio | legacy_target_calibrated
  method: two_log_ratio

combination:
  # Supported: empirical_only | equal_weight | legacy_equal_weight
  # Rejected until specified: fixed_weight | validation_optimised
  # optimal_weight() is a research helper only; it is not a production workflow.
  # Authoritative legacy weights: w_T = 1 - w_E. transfer_weight must match that rule.
  method: empirical_only
  empirical_weight: 0.5
  transfer_weight: 0.5

validation:
  enabled: true
  metric: mae
  min_n: 5

extrapolation:
  accept_max_semitones: 3
  review_max_semitones: 6
  allow_long_extrapolation: false
  # REVIEW_REQUIRED stays visible but is not production-eligible unless true.
  allow_review_required: false

disagreement:
  relative_epsilon: 1.0e-12
